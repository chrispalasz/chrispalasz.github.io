name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'issues' || github.event.issue.title == 'Trigger portfolio deployment') &&
      (github.event_name != 'pull_request' || github.head_ref == 'portfolio-deploy-trigger')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Capture the published portfolio
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='https://christopher-palasz-portfolio.chrispalasz.chatgpt.site/'
          HOST='christopher-palasz-portfolio.chrispalasz.chatgpt.site'
          rm -rf _site mirror
          mkdir -p _site mirror

          wget \
            --recursive \
            --level=6 \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --span-hosts \
            --domains="$HOST,cdn.openai.com,files.oaiusercontent.com,chatgpt.com" \
            --user-agent='Mozilla/5.0' \
            --directory-prefix=mirror \
            "$SOURCE" || true

          INDEX="$(find mirror -type f \( -name 'index.html' -o -name 'index.htm' \) | head -n 1 || true)"
          if [[ -n "$INDEX" ]]; then
            ROOT="$(dirname "$INDEX")"
            cp -a "$ROOT/." _site/
          fi

          if [[ ! -s _site/index.html ]]; then
            curl -fL -A 'Mozilla/5.0' --retry 3 --retry-delay 2 "$SOURCE" -o _site/index.html
          fi

          # Do not allow a redirect-only result. The GitHub copy must contain the
          # portfolio page itself and must not depend on ChatGPT for navigation.
          if grep -Eqi 'http-equiv=["'"']refresh|location\.(href|replace)|window\.location' _site/index.html; then
            echo 'Captured index appears to redirect instead of containing the portfolio.' >&2
            exit 1
          fi

          touch _site/.nojekyll
          test -s _site/index.html
          echo 'Captured files:'
          find _site -maxdepth 4 -type f | sort

      - name: Verify public copy remains phone-free
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
import re
import zipfile
from pathlib import Path

phone = re.compile(r'(?<!\d)(?:\+?1[ .-]?)?(?:\(\d{3}\)|\d{3})[ .-]\d{3}[ .-]\d{4}(?!\d)')
violations = []
for p in Path('_site').rglob('*'):
    if not p.is_file():
        continue
    name = p.name.lower()
    suffix = p.suffix.lower()
    text = ''
    try:
        if suffix in {'.html', '.htm', '.txt', '.md'}:
            text = p.read_text(encoding='utf-8', errors='ignore')
        elif suffix == '.docx' and ('resume' in name or 'cv' in name):
            with zipfile.ZipFile(p) as z:
                text = z.read('word/document.xml').decode('utf-8', errors='ignore')
    except Exception:
        continue
    if text and phone.search(text):
        violations.append(str(p))
if violations:
    print('A phone number was detected in public-facing site content:')
    print('\n'.join(violations))
    raise SystemExit(1)
PY

      - name: Preserve captured site in repository
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for item in _site/*; do
            base="$(basename "$item")"
            [[ "$base" == '.github' ]] && continue
            rm -rf -- "$base"
            cp -a -- "$item" "$base"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish independent portfolio snapshot'
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
