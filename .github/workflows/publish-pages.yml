name: Publish portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'issues' || github.event.issue.title == 'Trigger portfolio deployment')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Capture the published portfolio
        shell: bash
        run: |
          set -u
          SOURCE='https://christopher-palasz-portfolio.chrispalasz.chatgpt.site/'
          HOST='christopher-palasz-portfolio.chrispalasz.chatgpt.site'
          rm -rf _site mirror
          mkdir -p _site mirror

          # First attempt: mirror the existing published site and same-host assets.
          wget \
            --recursive \
            --level=5 \
            --page-requisites \
            --convert-links \
            --adjust-extension \
            --no-parent \
            --user-agent='Mozilla/5.0' \
            --directory-prefix=mirror \
            "$SOURCE" || true

          INDEX="$(find mirror -type f \( -name 'index.html' -o -name 'index.htm' \) | head -n 1 || true)"
          if [[ -n "$INDEX" ]]; then
            ROOT="$(dirname "$INDEX")"
            cp -a "$ROOT/." _site/
          fi

          # Fallback: preserve the live HTML and resolve relative resources against
          # the original published site. This prevents a failed mirror from leaving
          # GitHub Pages with no index file.
          if [[ ! -s _site/index.html ]]; then
            curl -fL \
              -A 'Mozilla/5.0' \
              --retry 3 \
              --retry-delay 2 \
              "$SOURCE" \
              -o _site/index.html || true

            if [[ -s _site/index.html ]]; then
              python3 - <<'PY'
from pathlib import Path
p = Path('_site/index.html')
s = p.read_text(encoding='utf-8', errors='ignore')
base = '<base href="https://christopher-palasz-portfolio.chrispalasz.chatgpt.site/">'
if '<base ' not in s.lower():
    lower = s.lower()
    pos = lower.find('<head>')
    if pos >= 0:
        pos += len('<head>')
        s = s[:pos] + base + s[pos:]
    else:
        s = base + s
p.write_text(s, encoding='utf-8')
PY
            fi
          fi

          # Last-resort continuity page. The GitHub URL will still resolve to the
          # existing portfolio rather than returning a 404.
          if [[ ! -s _site/index.html ]]; then
            cat > _site/index.html <<'HTML'
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://christopher-palasz-portfolio.chrispalasz.chatgpt.site/">
  <title>Christopher Palasz | Instructional Design Portfolio</title>
  <link rel="canonical" href="https://christopher-palasz-portfolio.chrispalasz.chatgpt.site/">
</head>
<body>
  <p><a href="https://christopher-palasz-portfolio.chrispalasz.chatgpt.site/">Open Christopher Palasz's portfolio</a></p>
</body>
</html>
HTML
          fi

          touch _site/.nojekyll
          test -s _site/index.html
          echo 'Captured files:'
          find _site -maxdepth 3 -type f | sort

      - name: Verify public copy remains phone-free
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
import re
import zipfile
from pathlib import Path

phone = re.compile(r'(?<!\d)(?:\+?1[ .-]?)?(?:\(\d{3}\)|\d{3})[ .-]\d{3}[ .-]\d{4}(?!\d)')
root = Path('_site')
violations = []

for p in root.rglob('*'):
    if not p.is_file():
        continue
    name = p.name.lower()
    suffix = p.suffix.lower()
    text = ''
    try:
        if suffix in {'.html', '.htm', '.txt', '.md'}:
            text = p.read_text(encoding='utf-8', errors='ignore')
        elif suffix == '.docx' and ('resume' in name or 'cv' in name):
            with zipfile.ZipFile(p) as z:
                text = z.read('word/document.xml').decode('utf-8', errors='ignore')
    except Exception:
        continue
    if text and phone.search(text):
        violations.append(str(p))

if violations:
    print('A phone number was detected in public-facing site content:')
    for v in violations:
        print(v)
    raise SystemExit(1)
PY

      - name: Preserve captured site in repository
        shell: bash
        run: |
          set -euo pipefail
          shopt -s dotglob nullglob
          for item in _site/*; do
            base="$(basename "$item")"
            [[ "$base" == '.github' ]] && continue
            rm -rf -- "$base"
            cp -a -- "$item" "$base"
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish portfolio snapshot'
            git push origin HEAD:main
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
