name: COPY SITE INTO GITHUB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Copy public portfolio into repository
        run: python scripts/import_site.py

      - name: Replace old site files with copied portfolio
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='scripts/' \
            /tmp/portfolio-site/ ./
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No file changes detected.'
          else
            git commit -m 'Copy portfolio into GitHub Pages'
            git push origin main
          fi
